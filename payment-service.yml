server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ticketflow
    # Le mot de passe n'est volontairement PAS ici : variable d'environnement SPRING_DATASOURCE_PASSWORD
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[max.block.ms]": 5000

ticketflow:
  payments:
    simulation-enabled: true
  kafka:
    topics:
      payment-succeeded: ticketflow.payment.succeeded
      payment-failed: ticketflow.payment.failed
      booking-cancelled: ticketflow.booking.cancelled
      dlt: ticketflow.notification.dlt

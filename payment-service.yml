server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ticketflow
    # Le mot de passe n'est volontairement PAS ici : variable d'environnement SPRING_DATASOURCE_PASSWORD
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
ticketflow:
  payments:
    simulation-enabled: true
